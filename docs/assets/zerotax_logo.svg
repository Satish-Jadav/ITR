<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072726"/>
      <stop offset="50%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020B0A"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0F766E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D3B39" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#061F1E" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="rupeeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>
  <circle cx="256" cy="256" r="210" fill="url(#tealGlow)"/>

  <!-- Sovereign Security Shield -->
  <path d="M 256,92 L 396,142 C 396,275 330,378 256,420 C 182,378 116,275 116,142 Z" 
        fill="url(#shieldFill)" 
        stroke="#14B8A6" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#softGlow)"/>

  <!-- Sovereign Inner Crest Line -->
  <path d="M 256,116 L 372,158 C 372,268 316,356 256,394 C 196,356 140,268 140,158 Z" 
        fill="none" 
        stroke="#0F766E" 
        stroke-width="3" 
        stroke-opacity="0.6"/>

  <!-- Rupee Symbol Geometry -->
  <!-- Top Bar -->
  <path d="M 194,188 L 318,188" 
        stroke="url(#rupeeGradient)" 
        stroke-width="18" 
        stroke-linecap="round"/>

  <!-- Second Bar -->
  <path d="M 194,232 L 298,232" 
        stroke="url(#rupeeGradient)" 
        stroke-width="18" 
        stroke-linecap="round"/>

  <!-- Vertical Stem and Upper Loop -->
  <path d="M 226,188 L 226,276 C 290,276 290,214 226,214" 
        fill="none" 
        stroke="url(#rupeeGradient)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Dynamic Verification Surge / Emerald Check Leg -->
  <path d="M 226,276 L 318,368" 
        stroke="url(#checkGradient)" 
        stroke-width="20" 
        stroke-linecap="round"
        filter="url(#softGlow)"/>

  <!-- Cryptographic Zenith Star (Top Apex) -->
  <polygon points="256,64 263,77 277,84 263,91 256,104 249,91 235,84 249,77" 
           fill="#14B8A6"/>
</svg>

